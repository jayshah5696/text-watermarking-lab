[project]
name = "text-watermarking-lab"
version = "0.1.0"
description = "A from-scratch learning lab for statistical text watermarks"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "matplotlib>=3.10,<4",
  "mlx>=0.31.2,<0.33",
  "mlx-lm>=0.31.3,<0.32",
  "torch>=2.8,<3",
  "transformers>=5.14,<5.15",
]

[dependency-groups]
dev = [
  "modal==1.5.3",
  "pyright>=1.1,<2",
  "pytest>=8,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "scipy>=1.15,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/watermark_lab"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "labs", "scripts", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
extraPaths = ["src"]
strict = ["src"]
reportMissingTypeStubs = false
reportUnnecessaryIsInstance = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"

[tool.coverage.run]
branch = true
source = ["watermark_lab"]
omit = [
  "src/watermark_lab/modal_app.py",
  "src/watermark_lab/modal_app_06.py",
  "src/watermark_lab/modal_app_07.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95
omit = [
  "src/watermark_lab/lab07_config.py",
  "src/watermark_lab/lab07_records.py",
]
